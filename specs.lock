# specs.lock — pinned FHIR specification artifacts.
#
# The generator reads these three files per version and nothing else. They are
# gitignored (~143 MB total), so this file is the only record of where they come
# from and which bytes are expected. scripts/fetch-specs.sh verifies every hash.
#
# Format:  <version> <fhir-release> <file> <sha256> <url>
# Lines starting with # and blank lines are ignored.
#
# Each release ships one definitions.json.zip; the three files below are extracted
# from it. Downloading the zip once per version is cheaper than three fetches.
#   r4  -> http://hl7.org/fhir/R4/definitions.json.zip
#   r4b -> http://hl7.org/fhir/R4B/definitions.json.zip
#   r5  -> http://hl7.org/fhir/R5/definitions.json.zip

