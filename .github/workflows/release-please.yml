name: Release Please

on:
  push:
    branches:
      - main
      # The v1 maintenance line, cut at r4/v1.5.1 before main moved its module
      # paths to /v2. It exists because a v1.6.0 cannot be released from main at
      # all: Go rejects the tag with "post-v1 module path", so the deprecation
      # warnings that tell users what v2 removes have nowhere else to ship from.
      #
      # Named "maintenance-v1" and not "v1" for a concrete reason: with the branch
      # called "v1", the default group title is "chore: release v1", and on merge
      # release-please parses that trailing "v1" as a version and dies with
      # "unable to parse version string: 1" — after the release PR has already
      # landed the manifest bump, so the tags never get cut. Reproduced locally
      # against the real repo. "main" works precisely because it does not look
      # like a version, and this name follows it.
      - maintenance-v1

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      r4--release_created: ${{ steps.release.outputs['r4--release_created'] }}
      r4b--release_created: ${{ steps.release.outputs['r4b--release_created'] }}
      r5--release_created: ${{ steps.release.outputs['r5--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without this, release-please assumes the repository's default branch
          # and would open the v1 release PR against main. Each branch carries its
          # own manifest, so the two lines advance independently from the 1.5.1
          # they share: v1 to 1.6.0, main to 2.0.0.
          target-branch: ${{ github.ref_name }}

  post-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [r4, r4b, r5]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify ${{ matrix.module }} module
        run: |
          echo "Verifying ${{ matrix.module }} module..."
          cd ${{ matrix.module }}
          go build ./...
          go test ./...
