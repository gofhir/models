name: CI

on:
  push:
    # v1 as well as main: it is a released maintenance line, and its release
    # commits land by merge, so without this they would ship unverified.
    branches: [main, maintenance-v1]
  # Any pull request, not just those targeting main, so stacked PRs get checked
  # too. A stack whose lower half is unverified is worse than no stack.
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  # The generator itself. Until this job existed, internal/codegen/** and
  # cmd/generator were never compiled, tested or linted by CI — which is where
  # the value-set collision and the silent enum degradation both lived.
  #
  # GOWORK=off on purpose: go.work is gitignored local tooling, and building the
  # module in isolation is what proves its own go.mod/go.sum are complete.
  generator:
    name: Generator
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify root module
        run: |
          go mod verify
          go build ./...
          go vet ./internal/...

      - name: Test
        run: go test -race ./internal/...

      # v8 of the action is the first line that runs golangci-lint v2; v4
      # resolves "latest" to v1.64.x, which rejects a v2 config outright. The
      # version is pinned rather than "latest" so a linter release cannot turn a
      # green PR red on its own. Timeout comes from run.timeout in .golangci.yml.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: ./internal/...

      # cmd/generator is its own module with a replace back to the root, so it
      # has to be built from its own directory.
      - name: Verify cmd/generator module
        working-directory: cmd/generator
        run: |
          go build ./...
          go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [r4, r4b, r5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint for ${{ matrix.module }}
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [r4, r4b, r5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.module }}-
            ${{ runner.os }}-go-

      - name: Run tests for ${{ matrix.module }}
        run: |
          cd ${{ matrix.module }}
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.txt
          flags: ${{ matrix.module }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        module: [r4, r4b, r5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ${{ matrix.module }}
        run: |
          cd ${{ matrix.module }}
          go build -v ./...

  verify-modules:
    name: Verify Modules
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        module: [r4, r4b, r5]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify ${{ matrix.module }} module
        run: |
          cd ${{ matrix.module }}
          go mod verify
          go build ./...

  # Round-trip every published FHIR example through the library and compare the
  # result against the recorded known-failure lists. Catches both regressions and
  # fixes that nobody wrote down.
  #
  # Its own module, so the published r4/r4b/r5 modules carry neither the suite nor
  # its corpus.
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The archives are what the hash is pinned against, so caching them (rather
      # than the unpacked tree) keeps the verification meaningful.
      - name: Cache example archives
        uses: actions/cache@v4
        with:
          path: conformance/testdata/.archives
          key: examples-${{ hashFiles('examples.lock') }}

      - name: Fetch and verify examples
        run: scripts/fetch-examples.sh

      - name: Round-trip the corpus
        working-directory: conformance
        run: go test -timeout 20m ./...

  # Regenerate every version from the pinned specs and fail if the result differs
  # from what is committed. Without this, a change to a template or to the
  # analyzer can land without anyone noticing what it did to the output.
  drift:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    needs: [generator]
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache FHIR specs
        uses: actions/cache@v4
        with:
          path: specs
          key: specs-${{ hashFiles('specs.lock') }}

      - name: Fetch and verify specs
        run: scripts/fetch-specs.sh

      # Run from cmd/generator: main.go derives the repo root from the working
      # directory, and the module lives there.
      - name: Regenerate all versions
        working-directory: cmd/generator
        run: |
          for v in r4 r4b r5; do
            go run . "$v"
          done

      # A positive assertion, not just a diff: if generation silently produced no
      # enums, the diff would be huge and obvious, but if it produced none *and*
      # left the old file behind, only a count catches it.
      - name: Assert enum types were generated
        run: |
          for v in r4 r4b r5; do
            n=$(grep -cE '^type [A-Za-z0-9]+ string$' "$v/codesystems.go" || true)
            echo "$v: $n enum types"
            if [ "$n" -lt 200 ]; then
              echo "::error::$v/codesystems.go has only $n enum types (expected >= 200)"
              exit 1
            fi
          done

      - name: Check for drift
        run: |
          if ! git diff --quiet -- r4 r4b r5; then
            echo "::error::generated code is out of date; regenerate and commit the result"
            git diff --stat -- r4 r4b r5
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- r4 r4b r5)" ]; then
            echo "::error::generation produced untracked files; commit them or add them to .gitignore"
            git status --porcelain --untracked-files=all -- r4 r4b r5
            exit 1
          fi
          echo "no drift: committed output matches the generator"
