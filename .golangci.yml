version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # gosimple and stylecheck no longer exist as separate linters in v2;
    # both were folded into staticcheck.
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment # too strict for generated structs

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 150

    goconst:
      min-len: 5
      min-occurrences: 4

    misspell:
      locale: US

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam    # generated structs are large by nature
        - rangeValCopy # generated code copies values

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    # Recognise generated files by their canonical header rather than by path.
    # Every file the generator emits starts with
    #   // Code generated by gofhir. DO NOT EDIT.
    # while marshal.go, doc.go and helpers/ are hand-written and must stay linted.
    generated: strict

    rules:
      # The generated packages used to be excluded by a path pattern covering all
      # of r4|r4b|r5, which also silenced the hand-written files living beside the
      # generated ones — it was hiding a real revive finding in helpers/loinc.go.
      # Anything still needed for generated code belongs above, via `generated`.
      #
      # dupl is the one linter the header-based exclusion does not cover, because
      # near-identical shapes across 146 resource files are inherent to codegen.
      - path: '(^|/)(datatypes|codesystems|interfaces|registry|summary|decimal|xml_helpers|fhirpath_model|resource_[a-z0-9]+)\.go$'
        linters:
          - dupl

      # The generator emits long, necessarily branchy template-driven functions.
      - path: 'internal/codegen/.*\.go$'
        linters:
          - dupl
          - gocyclo

      # Reading spec files and writing package directories from computed paths is
      # what a code generator does; it is a build-time CLI, not a service
      # handling untrusted input. G304 (file inclusion via variable), G301
      # (directory permissions) and G122 (path in a Walk callback) have no threat
      # model here.
      - path: 'internal/codegen/.*\.go$'
        linters:
          - gosec
        text: 'G304|G301|G122'

      - path: '_test\.go$'
        linters:
          - dupl
          - gosec
          - goconst
          - gocyclo

      # A package comment belongs on the package's own source, not on a test file.
      # revive reports it against the first file it sees, which in r4b and r5 is
      # codesystems_test.go because those packages have no doc.go — the real gap,
      # tracked as task 3.3 in PLAN.md. Excluding it here keeps the finding
      # pointing at the right place instead of at a test.
      - path: '_test\.go$'
        linters:
          - revive
        text: 'package-comments'

      - path: 'doc\.go$'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/gofhir/models

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
