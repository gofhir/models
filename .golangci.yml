version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # gosimple and stylecheck no longer exist as separate linters in v2;
    # both were folded into staticcheck.
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment # too strict for generated structs

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 150

    goconst:
      min-len: 5
      min-occurrences: 4

    misspell:
      locale: US

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam    # generated structs are large by nature
        - rangeValCopy # generated code copies values

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    rules:
      # Generated packages. These paths used to point at pkg/fhir, pkg/fhirpath
      # and pkg/validator — directories that do not exist in this repository —
      # so none of these exclusions had any effect. The generated code lives in
      # r4/, r4b/ and r5/.
      - path: '(^|/)(r4|r4b|r5)/.*\.go$'
        linters:
          - dupl
          - gocyclo
          - goconst
          - gocritic
          - revive
          - unparam

      # The generator emits long, necessarily branchy template-driven functions.
      - path: 'internal/codegen/.*\.go$'
        linters:
          - dupl
          - gocyclo

      # Reading spec files and writing package directories from computed paths is
      # what a code generator does; it is a build-time CLI, not a service
      # handling untrusted input. G304 (file inclusion via variable), G301
      # (directory permissions) and G122 (path in a Walk callback) have no threat
      # model here.
      - path: 'internal/codegen/.*\.go$'
        linters:
          - gosec
        text: 'G304|G301|G122'

      - path: '_test\.go$'
        linters:
          - dupl
          - gosec
          - goconst
          - gocyclo

      - path: 'doc\.go$'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/gofhir/models

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
